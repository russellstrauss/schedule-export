# Deploys sync-schedule when Cloud Build runs on a push to main.
# Secret names must match Secret Manager. Payloads are not stored in this file.
steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - sync-schedule
      - --gen2
      - --runtime=nodejs24
      - --region=us-central1
      - --source=.
      - --entry-point=syncSchedule
      - --trigger-http
      - --allow-unauthenticated
      - --memory=1GB
      - --timeout=600s
      - --max-instances=1
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,SCHEDULE_SOURCES=rhino,crewOne,CREWONE_LOGIN_URL=https://portal.crew1.com/
      - --set-secrets=RHINO_EMAIL=rhino-email:latest,RHINO_PASSWORD=rhino-password:latest,CREWONE_EMAIL=crewone-email:latest,CREWONE_PASSWORD=crewone-password:latest,GOOGLE_CLIENT_ID=google-oauth-client-id:latest,GOOGLE_CLIENT_SECRET=google-oauth-client-secret:latest,GOOGLE_REDIRECT_URI=google-oauth-redirect-uri:latest,GOOGLE_TOKEN=google-oauth-token:latest,IATSE_ALLOWED_PHONE=iatse-allowed-phone:latest,GEMINI_API_KEY=gemini-api-key:latest
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
