# Deploys the nightly sync function. The trigger may run in another project;
# the function itself lives in rhino-schedule-sync. Existing environment
# variables on the function are left in place.
steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - functions
      - deploy
      - sync-schedule
      - --project=rhino-schedule-sync
      - --gen2
      - --runtime=nodejs24
      - --region=us-central1
      - --source=.
      - --entry-point=syncSchedule
      - --trigger-http
      - --allow-unauthenticated
      - --memory=1GB
      - --timeout=600s
      # Keep one spare instance available for fast health responses while a
      # long-running scheduled sync occupies the other instance.
      - --max-instances=2
timeout: 1200s
options:
  logging: CLOUD_LOGGING_ONLY
